name: Build APK
on:
  workflow_dispatch:
  push:
    branches: [main]
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: 8.9
      - name: Build
        run: |
          find . -not -path './.git/*' | head -60
          S=$(find . -name settings.gradle.kts -not -path './.git/*' | head -n 1)
          if [ -z "$S" ]; then echo "settings.gradle.kts not found"; exit 1; fi
          cd "$(dirname "$S")"
          gradle assembleDebug --no-daemon
      - uses: actions/upload-artifact@v4
        with:
          name: goals-apk
          path: '**/app-debug.apk'
